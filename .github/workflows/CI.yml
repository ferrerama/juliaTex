name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref == '' && github.run_number || '' }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  example:
    name: Example - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # LTS
          - '1'      # latest stable 1.x
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Install Julia packages
        # CorporateFinance.jl is not registered: Julia 1.11+ reads [sources] in Project.toml, 1.10 needs the URL
        run: julia --project=. -e 'using Pkg; VERSION < v"1.11" && Pkg.add(url = "https://github.com/ferrerama/CorporateFinance.jl", rev = "v0.1.0"); Pkg.instantiate(); Pkg.precompile()'
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install LaTeX packages
        shell: pwsh # on Windows tlmgr is a .bat, which bash cannot run
        run: tlmgr install latexmk titling listings
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Compile the example from scratch
        run: |
          rm -f analysis.pdf analysis.md resources/*
          latexmk analysis.tex
      - name: Check the results
        run: |
          test -s analysis.pdf
          test -s analysis.md
          test -s resources/bridge.pdf
          test -s resources/bridge.svg
          test -s resources/bridge.gif
          ! grep -E 'Package juliatex Warning|^! ' analysis.log
          grep -q 'the enterprise value is 1,998,670' analysis.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: example-julia${{ matrix.version }}-${{ matrix.os }}
          path: |
            example/analysis.pdf
            example/analysis.md
            example/analysis.log
            example/.juliatex/analysis/julia.log
          include-hidden-files: true

  neovim-f5:
    # F5 of nvim/init.lua on a lone .tex: no .latexmkrc, no chktexrc, no Project.toml
    name: Neovim F5 - lone .tex - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install Julia packages (the example's environment, used by a lone .tex)
        working-directory: example
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install LaTeX packages
        shell: pwsh # on Windows tlmgr is a .bat, which bash cannot run
        run: tlmgr install latexmk listings
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install the Neovim plugins
        run: nvim --headless -u "$GITHUB_WORKSPACE/nvim/init.lua" "+Lazy! sync" +qa
      - name: F5 on a lone .tex
        run: |
          mkdir -p "$RUNNER_TEMP/lone" && cd "$RUNNER_TEMP/lone"
          cat > lone.tex <<'EOF'
          \documentclass{article}
          \usepackage{juliatex}
          \begin{document}
          A damped function and its plot.
          \begin{juliacode}
          using Plots
          f(x) = exp(-0.1x) * sin(x)
          plot(f, 0, 50, label = "f(x)")
          savefig("plot.pdf");
          \end{juliacode}
          \juliagraphics[width=0.7\linewidth]{plot.pdf}
          \end{document}
          EOF
          timeout 1200 nvim --headless -u "$GITHUB_WORKSPACE/nvim/init.lua" lone.tex \
            -c 'exe "normal \<F5>"' \
            -c 'lua vim.wait(1100000, function() return vim.fn.eval("b:vimtex.compiler.status") >= 2 end, 1000)' \
            -c 'lua print("vimtex status " .. vim.fn.eval("b:vimtex.compiler.status"))' \
            -c 'VimtexStop' -c 'qa!'
          test -s lone.pdf
          test -s plot.pdf
          ! grep -E 'Package juliatex Warning|^! ' lone.log
          grep -q 'fig-plot.pdf' lone.log
      - name: Julia language server inside a .tex
        # Installs LanguageServer.jl into nvim/lsp/ and waits for both errors on the .tex
        run: |
          mkdir -p "$RUNNER_TEMP/lsp" && cd "$RUNNER_TEMP/lsp"
          cat > lsp.tex <<'EOF'
          \documentclass{article}
          \usepackage{juliatex}
          \begin{document}
          \begin{juliacode}
          y = undefined_thing + 1
          \end{juliacode}
          A value: \juliav{nothere(3)}.
          \end{document}
          EOF
          cat > check.lua <<'EOF'
          vim.wait(1100000, function() return #vim.diagnostic.get(0) >= 2 end, 1000)
          local out = {}
          for _, d in ipairs(vim.diagnostic.get(0)) do
            out[#out + 1] = ("L%d:%d %s"):format(d.lnum + 1, d.col, d.message)
          end
          vim.fn.writefile(out, "diagnostics.txt")
          vim.cmd("qa!")
          EOF
          timeout 1200 nvim --headless -u "$GITHUB_WORKSPACE/nvim/init.lua" lsp.tex -c 'luafile check.lua'
          cat diagnostics.txt
          grep -q 'L5:4 Missing reference: undefined_thing' diagnostics.txt
          grep -q 'L7:17 Missing reference: nothere' diagnostics.txt
          test ! -e lsp.juliatex.jl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: neovim-f5-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/lone/lone.log
            ${{ runner.temp }}/lone/.juliatex/lone/julia.log
          include-hidden-files: true

  readme-ubuntu:
    # Follows the README literally on Ubuntu: distribution packages + the official Julia installer
    name: README steps - Ubuntu (apt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - name: Install LaTeX and pandoc (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-luatex texlive-latex-extra latexmk pandoc
      - name: Install Julia (juliaup)
        run: |
          curl -fsSL https://install.julialang.org | sh -s -- --yes
          echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: Install Julia packages
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Compile the example from scratch
        run: |
          rm -f analysis.pdf analysis.md resources/*
          latexmk analysis.tex
      - name: Check the results
        run: |
          lualatex --version | head -1; pandoc --version | head -1; julia --version
          test -s analysis.pdf
          test -s analysis.md
          test -s resources/bridge.svg
          test -s resources/bridge.gif
          ! grep -E 'Package juliatex Warning|^! ' analysis.log
          grep -q 'the enterprise value is 1,998,670' analysis.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: example-readme-ubuntu
          path: |
            example/analysis.pdf
            example/analysis.md
            example/analysis.log
            example/.juliatex/analysis/julia.log
          include-hidden-files: true
